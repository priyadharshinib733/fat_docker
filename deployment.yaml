
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-maintenance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: predictive-maintenance
  template:
    metadata:
      labels:
        app: predictive-maintenance
    spec:
      containers:
        - name: predictive-maintenance
          image: priyadharshinib733/predictive-maintenance:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance-service
spec:
  type: NodePort
  selector:
    app: predictive-maintenance
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
